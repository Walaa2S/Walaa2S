<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05030a"/><stop offset=".52" stop-color="#11081f"/><stop offset="1" stop-color="#291054"/></linearGradient>
 <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#5b21b6"/><stop offset=".48" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
 <radialGradient id="g"><stop stop-color="#9b6dff" stop-opacity=".5"/><stop offset="1" stop-color="#9b6dff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#a78bfa" stroke-opacity=".06"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<style>
 .eye{font:600 14px Arial,sans-serif;letter-spacing:5px;fill:#bca8ff}
 .name{font:800 67px Arial,sans-serif;fill:#fff}
 .role{font:600 23px Arial,sans-serif;fill:#eee9ff}
 .copy{font:400 17px Arial,sans-serif;fill:#c8bfd6}
 .tiny{font:600 12px Arial,sans-serif;letter-spacing:2px;fill:#d9ceff}
 .orb1{animation:o1 7s ease-in-out infinite}.orb2{animation:o2 9s ease-in-out infinite}
 .panel{animation:float 5s ease-in-out infinite;transform-origin:center}
 .scan{animation:scan 4s ease-in-out infinite}
 .blink{animation:blink 2.2s ease-in-out infinite}
 @keyframes o1{0%,100%{transform:translate(0,0);opacity:.3}50%{transform:translate(-40px,25px);opacity:.75}}
 @keyframes o2{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(35px,-30px);opacity:.6}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes scan{0%,100%{transform:translateX(-40px);opacity:0}50%{transform:translateX(240px);opacity:.8}}
 @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<rect width="1200" height="430" rx="30" fill="url(#bg)"/><rect width="1200" height="430" rx="30" fill="url(#grid)"/>
<circle class="orb1" cx="1040" cy="90" r="240" fill="url(#g)" filter="url(#blur)"/><circle class="orb2" cx="810" cy="390" r="180" fill="url(#g)" filter="url(#blur)"/>
<rect x="66" y="62" width="5" height="25" rx="2" fill="url(#accent)"/><text x="90" y="81" class="eye">INFORMATICS ENGINEERING · BAHRAIN</text>
<text x="66" y="171" class="name">WALAA <tspan fill="#a78bfa">SALAH</tspan></text>
<text x="68" y="220" class="role">Front-End Developer  ·  UI/UX Designer</text>
<text x="68" y="258" class="role" fill="#a78bfa">AI &amp; Robotics</text>
<text x="68" y="315" class="copy">I design digital experiences that feel clear, intentional,</text><text x="68" y="342" class="copy">and human — then bring them to life through technology.</text>
<g class="panel">
 <rect x="855" y="100" width="275" height="178" rx="22" fill="#090610" stroke="#7c3aed" stroke-opacity=".65"/>
 <rect x="878" y="126" width="228" height="16" rx="8" fill="#17102b"/><rect x="878" y="126" width="88" height="16" rx="8" fill="url(#accent)"/>
 <circle class="blink" cx="891" cy="177" r="6" fill="#a78bfa"/><text x="910" y="182" class="tiny">DESIGN SYSTEM</text>
 <circle class="blink" cx="891" cy="210" r="6" fill="#7c3aed"/><text x="910" y="215" class="tiny">INTELLIGENT UI</text>
 <circle class="blink" cx="891" cy="243" r="6" fill="#5b21b6"/><text x="910" y="248" class="tiny">BUILD + ITERATE</text>
 <rect class="scan" x="850" y="92" width="2" height="190" fill="#c4b5fd"/>
</g>
<text x="855" y="323" class="tiny">DESIGN · BUILD · INTELLIGENCE</text>
<rect x="66" y="385" width="1065" height="2" rx="1" fill="url(#accent)" opacity=".75"/>
</svg>