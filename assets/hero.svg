<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07050d"/>
    <stop offset=".52" stop-color="#130b24"/>
    <stop offset="1" stop-color="#281252"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop stop-color="#7c3aed"/>
    <stop offset=".5" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#5b21b6"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<style>
  .eyebrow{font:600 15px Arial,sans-serif;letter-spacing:5px;fill:#b9a4ff}
  .name{font:800 64px Arial,sans-serif;fill:#fff}
  .role{font:600 24px Arial,sans-serif;fill:#eee9ff}
  .body{font:400 18px Arial,sans-serif;fill:#c9c1d9}
  .small{font:600 14px Arial,sans-serif;letter-spacing:2px;fill:#d8ccff}
  .pulse{animation:p 4s ease-in-out infinite;transform-origin:center}
  @keyframes p{0%,100%{opacity:.28}50%{opacity:.72}}
  .float{animation:f 6s ease-in-out infinite}
  @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
<circle class="pulse" cx="1030" cy="80" r="220" fill="url(#glow)" filter="url(#blur)"/>
<circle class="pulse" cx="860" cy="360" r="180" fill="url(#glow)" filter="url(#blur)"/>
<path d="M820 0 L1200 0 L1200 390 L1000 390 Z" fill="#6d28d9" opacity=".07"/>
<path d="M930 0 L1200 0 L1200 390 L1080 390 Z" fill="#a78bfa" opacity=".05"/>
<rect x="65" y="58" width="5" height="25" rx="2" fill="url(#accent)"/>
<text x="88" y="77" class="eyebrow">INFORMATICS ENGINEERING</text>
<text x="65" y="160" class="name">WALAA <tspan fill="#a78bfa">SALAH</tspan></text>
<text x="68" y="210" class="role">Front-End Developer  ·  UI/UX Designer</text>
<text x="68" y="246" class="role" fill="#a78bfa">AI &amp; Robotics</text>
<text x="68" y="298" class="body">Designing intuitive digital experiences at the intersection of</text>
<text x="68" y="326" class="body">human-centered design, intelligent systems, and technology.</text>
<g class="float">
 <rect x="875" y="115" width="240" height="120" rx="20" fill="#0d0916" stroke="#7048bd" stroke-opacity=".65"/>
 <circle cx="910" cy="150" r="7" fill="#a78bfa"/>
 <circle cx="940" cy="150" r="7" fill="#6d28d9"/>
 <circle cx="970" cy="150" r="7" fill="#3b1e73"/>
 <path d="M910 190 H1070" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
 <path d="M910 214 H1025" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" opacity=".8"/>
</g>
<text x="875" y="285" class="small">DESIGN · BUILD · INNOVATE</text>
<rect x="65" y="354" width="1070" height="2" rx="1" fill="url(#accent)" opacity=".7"/>
</svg>